<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Quiz: Vollkommener Markt</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
  h1 { text-align: center; color: #333; }
  .question { background: #fff; border-radius: 12px; padding: 20px; margin: 20px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .question h3 { margin-top: 0; }
  .options { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .options button { padding: 10px 18px; border: 2px solid #4a90d9; background: #fff; border-radius: 8px; cursor: pointer; font-size: 15px; transition: all 0.2s; }
  .options button:hover { background: #e8f0fe; }
  .options button.selected { background: #4a90d9; color: #fff; }
  .options button.correct { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  .options button.wrong { background: #c62828; color: #fff; border-color: #c62828; }
  .options button.incorrect-missed { background: #fff; border-color: #2e7d32; color: #2e7d32; border-style: dashed; }
  #submit { display: block; margin: 30px auto; padding: 14px 40px; font-size: 18px; background: #4a90d9; color: #fff; border: none; border-radius: 10px; cursor: pointer; }
  #submit:hover { background: #357abd; }
  #result { text-align: center; font-size: 20px; margin: 20px 0; font-weight: bold; }
  .feedback { margin-top: 10px; font-size: 14px; color: #555; }
</style>
</head>
<body>
<h1>Quiz: Ist der Markt vollkommen?</h1>
<p style="text-align:center">Kreuz an, welche Bedingungen erfüllt sind. Mehrfachauswahl möglich!</p>

<div id="quiz"></div>
<button id="submit" onclick="evaluate()">Auswerten</button>
<div id="result"></div>

<script>
const questions = [
  { name: "Getreidebörse (Weizen)", correct: [1,2,3,4] },
  { name: "Luxusautos (Porsche, Bentley, Rolls-Royce)", correct: [4] },
  { name: "Lokaler Wochenmarkt (Gemüse, Obst)", correct: [3,4] },
  { name: "Aktienmarkt (DAX, elektronischer Handel)", correct: [1,2,3,4] },
  { name: "Handgefertigte Möbel (Einzelanfertigung)", correct: [4] },
  { name: "Benzinmarkt (Super 95)", correct: [1,2,4] },
  { name: "Bitcoin-Markt", correct: [1,2,3,4] },
  { name: "Arbeitsmarkt für erfahrene Chirurgen", correct: [4] }
];

const labels = {
  1: "Homogenität der Güter",
  2: "Markttransparenz",
  3: "Einheit von Raum & Zeit",
  4: "Rationalität"
};

let selections = questions.map(() => []);

function render() {
  const container = document.getElementById('quiz');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<h3>${i+1}. ${q.name}</h3>
      <div class="options">
        ${[1,2,3,4].map(n => `<button id="q${i}_o${n}" onclick="toggle(${i},${n})">${n} – ${labels[n]}</button>`).join('')}
      </div>
      <div class="feedback" id="fb${i}"></div>`;
    container.appendChild(div);
  });
}

function toggle(qi, oi) {
  const btn = document.getElementById(`q${qi}_o${oi}`);
  if (btn.classList.contains('correct') || btn.classList.contains('wrong') || btn.classList.contains('incorrect-missed')) return;
  const idx = selections[qi].indexOf(oi);
  if (idx === -1) { selections[qi].push(oi); btn.classList.add('selected'); }
  else { selections[qi].splice(idx,1); btn.classList.remove('selected'); }
}

function evaluate() {
  let score = 0;
  questions.forEach((q, i) => {
    const user = selections[i].sort();
    const correct = [...q.correct].sort();
    const perfect = user.length === correct.length && user.every((v,j) => v === correct[j]);
    if (perfect) score++;

    [1,2,3,4].forEach(n => {
      const btn = document.getElementById(`q${i}_o${n}`);
      btn.classList.remove('selected');
      const inUser = user.includes(n);
      const inCorrect = correct.includes(n);
      if (inUser && inCorrect) btn.classList.add('correct');
      else if (inUser && !inCorrect) btn.classList.add('wrong');
      else if (!inUser && inCorrect) btn.classList.add('incorrect-missed');
    });

    const fb = document.getElementById(`fb${i}`);
    fb.innerHTML = perfect
      ? '✅ Richtig!'
      : `❌ Falsch. Richtig: ${correct.map(n => n + ' (' + labels[n] + ')').join(', ')}`;
  });

  document.getElementById('result').textContent = `Ergebnis: ${score} / ${questions.length}`;
  document.getElementById('submit').disabled = true;
}

render();
</script>
</body>
</html>
